[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autopsy-cli"
version = "0.1.0"
description = "Turn raw logs into incident postmortems — zero setup, fully local."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["devops", "logs", "postmortem", "incident", "cli", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
autopsy = "autopsy.cli:app"

[project.urls]
Homepage    = "https://github.com/yourusername/autopsy"
Repository  = "https://github.com/yourusername/autopsy"
"Bug Tracker" = "https://github.com/yourusername/autopsy/issues"

[tool.hatch.build.targets.wheel]
packages = ["autopsy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
