[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mr-autopsy"
version = "0.1.1"
description = "Turn raw logs into incident postmortems — zero setup, fully local."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["devops", "logs", "postmortem", "incident", "cli", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[project.scripts]
autopsy = "autopsy.cli:app"

[project.urls]
Repository  = "https://github.com/TK-ed/autopsy"
"Bug Tracker" = "https://github.com/TK-ed/autopsy/issues"

[tool.hatch.build.targets.wheel]
packages = ["autopsy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "DTZ"]
ignore = [
    "B008",   # Typer uses function calls in defaults
    "DTZ007", # handled by timezone normalization after parsing
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR2004", # magic values are acceptable for CLI thresholds
    "PLC0415", # local imports are sometimes intentional
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
